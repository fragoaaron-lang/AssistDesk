name: Deploy to Vercel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Vercel Deploy (CLI)
        if: ${{ env.VERCEL_TOKEN != '' }}
        continue-on-error: true
        run: |
          cd client
          vercel --prod --confirm --token "$VERCEL_TOKEN"

      - name: Skip Vercel CLI deploy when token is not configured
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: echo "VERCEL_TOKEN is not configured; skipping optional Vercel CLI deployment."
