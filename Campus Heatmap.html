<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Campus Heatmap</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif;background:#101827;color:#f3f6fb}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:radial-gradient(circle at 50% 35%,#26364d,#101827 72%)}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}#stage.dragging{cursor:grabbing}#heatmap{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transform:translate(calc(-50% + var(--pan-x,0px)),calc(-50% + var(--pan-y,0px))) scale(var(--zoom,1));transform-origin:center}
.panel{position:absolute;z-index:2;border:1px solid #ffffff24;border-radius:16px;background:#111a29df;box-shadow:0 10px 32px #0005;backdrop-filter:blur(12px)}#heading{top:max(14px,env(safe-area-inset-top));left:14px;padding:12px 16px}h1{margin:0;font-size:17px;letter-spacing:.01em}#heading p{margin:4px 0 0;color:#b7c4d7;font-size:12px}#tools{top:max(14px,env(safe-area-inset-top));right:14px;display:flex;gap:6px;padding:7px}button{min-width:38px;min-height:36px;padding:6px 11px;border:1px solid #ffffff25;border-radius:9px;background:#ffffff0c;color:#f3f6fb;font:inherit;font-size:13px;cursor:pointer}button:hover{background:#ffffff1c}button:focus-visible{outline:2px solid #7cb5ff;outline-offset:2px}#zoom-value{display:grid;min-width:48px;place-items:center;color:#d5deea;font-size:12px}#help{bottom:max(14px,env(safe-area-inset-bottom));left:14px;max-width:min(390px,calc(100% - 28px));padding:10px 14px}#help strong{display:block;font-size:13px}#help span{display:block;margin-top:3px;color:#b7c4d7;font-size:12px}#image-error{display:none;position:absolute;z-index:1;inset:50% auto auto 50%;width:min(440px,calc(100% - 36px));padding:20px;border-radius:14px;background:#111a29ed;text-align:center;transform:translate(-50%,-50%)}#image-error.visible{display:block}#image-error p{color:#c2ccdb;line-height:1.5}
@media(max-width:640px){#heading{top:max(10px,env(safe-area-inset-top));left:10px;padding:9px 11px}h1{font-size:15px}#heading p{font-size:11px}#tools{top:auto;right:10px;bottom:max(10px,env(safe-area-inset-bottom))}#help{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 54px);left:10px}button{min-width:36px;min-height:36px;padding:6px 9px}}
</style>
</head>
<body>
<main id="stage" aria-label="Interactive campus heatmap. Drag to pan; use the buttons or mouse wheel to zoom.">
  <img id="heatmap" src="heatmap.jpg" alt="Heatmap with colored activity zones and location markers on a street map" draggable="false">
</main>
<header id="heading" class="panel"><h1>Campus Heatmap</h1><p>Activity zones and location markers</p></header>
<nav id="tools" class="panel" aria-label="Map controls"><button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button><span id="zoom-value" aria-live="polite">100%</span><button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button><button id="reset" type="button">Reset</button></nav>
<aside id="help" class="panel"><strong>Heatmap view</strong><span>Drag to pan · Scroll or use + / − to zoom. Heat zones and pins are part of the image.</span></aside>
<section id="image-error" role="alert"><strong>Heatmap image not found</strong><p>Keep heatmap.jpg beside this HTML file so the map can load.</p></section>
<script>
const stage=document.getElementById('stage');
const image=document.getElementById('heatmap');
const zoomLabel=document.getElementById('zoom-value');
const error=document.getElementById('image-error');
let zoom=1,panX=0,panY=0,drag=null;
function render(){stage.style.setProperty('--zoom',zoom);stage.style.setProperty('--pan-x',`${panX}px`);stage.style.setProperty('--pan-y',`${panY}px`);zoomLabel.textContent=`${Math.round(zoom*100)}%`;}
function setZoom(next){zoom=Math.max(1,Math.min(4,next));if(zoom===1){panX=0;panY=0;}render();}
document.getElementById('zoom-in').addEventListener('click',()=>setZoom(zoom+.25));
document.getElementById('zoom-out').addEventListener('click',()=>setZoom(zoom-.25));
document.getElementById('reset').addEventListener('click',()=>{zoom=1;panX=0;panY=0;render();});
stage.addEventListener('wheel',event=>{event.preventDefault();setZoom(zoom+(event.deltaY<0?.15:-.15));},{passive:false});
stage.addEventListener('pointerdown',event=>{drag={x:event.clientX,y:event.clientY,panX,panY};stage.classList.add('dragging');stage.setPointerCapture(event.pointerId);});
stage.addEventListener('pointermove',event=>{if(!drag)return;panX=drag.panX+event.clientX-drag.x;panY=drag.panY+event.clientY-drag.y;render();});
function stopDrag(){drag=null;stage.classList.remove('dragging');}
stage.addEventListener('pointerup',stopDrag);stage.addEventListener('pointercancel',stopDrag);
image.addEventListener('error',()=>error.classList.add('visible'));image.addEventListener('load',()=>error.classList.remove('visible'));
render();
</script>
</body>
</html>
