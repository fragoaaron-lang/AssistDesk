<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus 3D Map</title>
<style>
:root{--bg1:#eef1f5;--bg2:#cdd6e2;--panel:#ffffffe8;--ink:#1d2430;--mute:#5b6678;--line:#d6dce6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b2230;--bg2:#10141d;--panel:#1c2331e8;--ink:#e8edf6;--mute:#9aa6bb;--line:#2e384b}}
:root[data-theme="dark"]{--bg1:#1b2230;--bg2:#10141d;--panel:#1c2331e8;--ink:#e8edf6;--mute:#9aa6bb;--line:#2e384b}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));color:var(--ink);font-family:"Outfit","Segoe UI",system-ui,sans-serif;overflow:hidden}
html.map-background body{background:transparent}
html.map-background #labels,html.map-background .ui{display:none!important}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;letter-spacing:.03em}
.ui{position:absolute;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
#top{left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px 12px;width:max-content;max-width:min(620px,calc(100vw - 420px));box-sizing:border-box}
h1{font-size:16px;margin:0 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 10px 4px 8px;font:inherit;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chip.off{opacity:.4}
.chip:focus-visible,.btn:focus-visible{outline:2px solid #3f8cf0;outline-offset:2px}
#tools{right:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:6px;display:flex;gap:6px;box-sizing:border-box}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
.btn[aria-pressed="true"]{background:#1769c2;color:#fff;border-color:#1769c2}
#info{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:10px 14px;min-width:220px;max-width:calc(100% - 24px)}
#info b{font-size:15px;display:block}
#info span{font-size:12px;color:var(--mute)}
#heatmap,#ticketLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#heatmap{z-index:2}
#ticketLayer{z-index:3}
.heat-dot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(239,35,45,.76) 0%,rgba(255,91,23,.62) 26%,rgba(255,187,0,.4) 58%,rgba(255,196,0,0) 78%);filter:blur(4px);mix-blend-mode:normal;pointer-events:none}
.ticket-pin{position:absolute;transform:translate(-50%,-100%) rotate(-45deg);width:11px;height:11px;padding:0;border:2px solid #fff;border-radius:50% 50% 50% 0;box-shadow:0 1px 5px rgba(16,24,40,.55);pointer-events:auto;cursor:pointer}
.ticket-pin::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#fff;pointer-events:none}
.ticket-pin.low{background:#34c759}.ticket-pin.medium{background:#3b82f6}.ticket-pin.urgent{background:#ef4444}
#legend{right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));padding:10px 12px;min-width:180px}
#legend strong{display:block;font-size:12px;margin-bottom:8px}
#legend .row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute);margin-bottom:4px}
#legend .sw{width:10px;height:10px;border-radius:50%}
#legend .sw.low{background:#34c759}#legend .sw.medium{background:#3b82f6}#legend .sw.urgent{background:#ef4444}
@media (max-width:760px){
  #top{left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));width:auto;max-width:none;padding:8px 10px}
  h1{font-size:14px;margin-bottom:6px}
  .chips{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-inline:contain;padding:0 0 3px;scrollbar-width:thin}
  .chip{flex:0 0 auto;min-height:34px;padding:6px 9px;font-size:11px}
  #tools{left:50%;right:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 16px);justify-content:center;gap:4px;padding:4px}
  .btn{min-height:40px;padding:7px 9px;font-size:11px;white-space:nowrap}
  #info{left:8px;bottom:calc(60px + env(safe-area-inset-bottom,0px));width:min(48%,220px);min-width:0;max-width:48%;padding:8px 10px}
  #info b{font-size:13px;line-height:1.25}
  #info span{display:-webkit-box;overflow:hidden;font-size:11px;line-height:1.3;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
  #legend{right:8px;bottom:calc(60px + env(safe-area-inset-bottom,0px));width:min(44%,190px);min-width:0;padding:8px 9px}
  #legend strong{font-size:11px;margin-bottom:5px}
  #legend .row{gap:5px;margin-bottom:2px;font-size:11px}
}
@media (max-width:380px){
  #info{width:44%;max-width:44%;padding:7px 8px}
  #legend{width:48%;padding:7px 8px}
  #legend .row{gap:4px;font-size:11px}
  .btn{padding-inline:7px;font-size:11px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="heatmap"></div>
<div id="ticketLayer"></div>
<div class="ui" id="top"><h1>Campus 3D Map</h1><div class="chips" id="chips"></div></div>
<div class="ui" id="tools">
<button class="btn" id="bl" aria-pressed="true">Road labels</button>
<button class="btn" id="br" aria-pressed="false">Auto-rotate</button>
<button class="btn" id="bz">Reset view</button>
</div>
<div class="ui" id="info"><b>Tap a building</b><span>Drag to rotate, scroll or pinch to zoom.</span></div>
<div class="ui" id="legend"><strong>Active tickets</strong><div class="row"><span class="sw low"></span>Low</div><div class="row"><span class="sw medium"></span>Medium</div><div class="row"><span class="sw urgent"></span>Urgent</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" integrity="sha384-wagZhIFgY4hD+7awjQjR4e2E294y6J2HSnd8eTNc15ZubTeQeVRZwhQJ+W6hnBsf" crossorigin="anonymous"></script>
<script src="/campus-map-3d-v3.js"></script>
</body>
</html>
